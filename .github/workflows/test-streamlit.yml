name: Streamlit App Tests

on:
  push:
    branches: [ GitConnectionTest, main, staging, 'feat/**', 'feature/**', '*feature*', '*Feature*' ]
  pull_request:
    branches: [ main, staging ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd streamlit-app
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run unit tests with coverage
      env:
        PYTHONPATH: .
      run: |
        cd streamlit-app
        pytest tests/test_api_client.py \
               tests/test_app.py \
               tests/test_config.py \
               tests/test_inventory.py \
               tests/test_ai_insights.py \
               tests/test_ai_insights_groq.py \
               tests/test_ai_insights_integration.py \
               tests/test_tabs.py \
               tests/test_tabs_comprehensive.py \
               tests/test_sidebar_comprehensive.py \
               tests/test_charts_comprehensive.py \
          --cov=. --cov-report= -v
    
    - name: Run integration tests with coverage
      env:
        APPTEST_MODE: 1
        PYTHONPATH: .
      run: |
        cd streamlit-app
        pytest tests/test_ui_integration.py \
          --cov=. --cov-append --cov-report=term --cov-report=html -v
    
    - name: Check coverage threshold
      run: |
        cd streamlit-app
        coverage report --fail-under=80
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: streamlit-coverage-report
        path: streamlit-app/htmlcov/
    
    - name: Test Summary
      run: |
        echo "✅ Streamlit tests passed!"
        echo "🧪 Unit tests: 117 tests total"
        echo "   • API client (13 tests)"
        echo "   • App basic (5 tests)"
        echo "   • Config (10 tests)"
        echo "   • Inventory (4 tests)"
        echo "   • AI insights Gemini (35 tests)"
        echo "   • AI insights Groq (18 tests)"
        echo "   • AI insights integration (10 tests)"
        echo "   • Tabs basic (3 tests)"
        echo "   • Tabs comprehensive (11 tests)"
        echo "   • Sidebar comprehensive (10 tests)"
        echo "   • Charts comprehensive (10 tests)"
        echo "🎭 Integration tests: UI component tests"
        echo "📊 Coverage: 82%+ (target: 80%+) ✅"
